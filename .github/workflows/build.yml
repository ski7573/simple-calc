name: Build Calculator

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Build Single File Exe
      run: dotnet publish calculator.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o ./output

    - name: Upload Exe Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Calculator-Program
        path: ./output/calculator.exe
